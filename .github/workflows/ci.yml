name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore TallyEnergyBilling.slnx
      - run: dotnet build TallyEnergyBilling.slnx --no-restore -c Release
      - run: dotnet test TallyEnergyBilling.slnx --no-build -c Release

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tally-energy-billing:ci .
